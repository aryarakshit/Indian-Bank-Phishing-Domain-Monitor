[project]
name = "indian-bank-phishing-domain-monitor"
version = "0.1.0"
description = "Real-time Certificate Transparency phishing domain monitor for Indian banks & financial services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "dnspython>=2.6.0",
    "tldextract>=5.1.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
